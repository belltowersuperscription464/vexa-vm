map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vm.example.com;

    ssl_certificate /etc/letsencrypt/live/vm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vm.example.com/privkey.pem;

    client_max_body_size 16G;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Stream large ISO uploads directly to Vexa-VM instead of writing a
        # second complete request-body copy to Nginx's temporary directory.
        proxy_request_buffering off;
        proxy_read_timeout 21600s;
    }
}
