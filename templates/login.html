{% extends "public_base.html" %}
{% block title %}Sign in · Vexa VM{% endblock title %}
{% block page_id %}login{% endblock page_id %}
{% block body %}
<main id="main-content" class="relative grid min-h-screen place-items-center overflow-hidden p-4" tabindex="-1">
  <div class="pointer-events-none absolute left-[8%] top-[12%] h-64 w-64 rounded-full bg-orbit-500/10 blur-3xl"></div>
  <div class="pointer-events-none absolute bottom-[8%] right-[8%] h-72 w-72 rounded-full bg-nebula-500/15 blur-3xl"></div>
  <section class="panel relative w-full max-w-md overflow-hidden p-6 sm:p-8" aria-labelledby="login-title">
    <div class="absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-orbit-300/80 to-transparent"></div>
    <div class="mb-8 flex items-center gap-3">
      <img src="/static/images/vexa-vm-emblem.png" alt="" class="h-11 w-11 object-contain drop-shadow-[0_0_16px_rgba(14,165,233,.4)]" width="44" height="44">
      <div><p class="text-xl font-extralight tracking-wide text-white">vexa<span class="text-orbit-300">-vm</span></p><p class="text-xs uppercase tracking-[.2em] text-slate-500">Node administration</p></div>
    </div>
    <h1 id="login-title" class="text-3xl font-hairline text-white">Welcome back</h1>
    <p class="mt-2 text-sm leading-6 text-slate-400">Sign in to manage this KVM node.</p>
    <form id="login-form" class="mt-7 space-y-5" novalidate>
      <div><label for="login-username" class="label">Username</label><input id="login-username" name="username" class="field" autocomplete="username" required autofocus></div>
      <div><div class="flex items-center justify-between"><label for="login-password" class="label">Password</label></div><div class="relative"><input id="login-password" name="password" type="password" class="field pr-20" autocomplete="current-password" required><button type="button" class="absolute inset-y-0 right-0 px-3 text-xs font-normal text-slate-400 hover:text-white" data-toggle-input="login-password" aria-pressed="false">Show</button></div></div>
      <div id="totp-field" class="hidden"><label for="login-totp" class="label">Authenticator code</label><input id="login-totp" name="totp" class="field font-mono tracking-[.35em]" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000"></div>
      <p id="login-error" class="hidden rounded-xl border border-rose-400/20 bg-rose-400/10 px-3 py-2.5 text-sm text-rose-200" role="alert"></p>
      <button type="submit" class="btn-primary w-full"><span>Sign in</span><svg viewBox="0 0 24 24" class="h-4 w-4 fill-none stroke-current" stroke-width="1.8"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></button>
    </form>
    <div class="mt-8 flex items-center justify-between gap-4 border-t border-white/[.07] pt-5 text-xs text-slate-600"><span>Server-side session</span><span id="login-version">vexa-vm</span></div>
  </section>
</main>
{% endblock body %}
