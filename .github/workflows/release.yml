name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v7

      - name: Verify release versions
        run: |
          set -Eeuo pipefail
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          guest_tools_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' guest-tools/Cargo.toml | head -n1)"
          [[ -n "${package_version}" && "${package_version}" == "${guest_tools_version}" ]] || {
            printf 'application version %s does not match Guest Tools version %s\n' \
              "${package_version:-missing}" "${guest_tools_version:-missing}" >&2
            exit 1
          }
          if [[ "${GITHUB_REF}" == refs/tags/v* \
            && "${GITHUB_REF_NAME#v}" != "${package_version}" ]]; then
            printf 'tag %s does not match Cargo package version %s\n' \
              "${GITHUB_REF_NAME}" "${package_version}" >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Build self-hosted panel assets
        run: |
          npm ci
          npm run build
          npm test

      - uses: dtolnay/rust-toolchain@1.75.0
        with:
          targets: ${{ matrix.target }},x86_64-pc-windows-gnu

      - uses: taiki-e/install-action@v2
        with:
          tool: cross@0.2.5

      - name: Require reproducible Rust dependency graphs
        run: |
          set -Eeuo pipefail
          test -s Cargo.lock || {
            printf 'the root Cargo.lock must be committed\n' >&2
            exit 1
          }
          test -s guest-tools/Cargo.lock || {
            printf 'guest-tools/Cargo.lock must be generated and committed before release\n' >&2
            exit 1
          }

      - name: Test
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo test --locked --all-targets
          cargo test --locked --manifest-path guest-tools/Cargo.toml --workspace

      - name: Build release binary
        run: cross build --locked --release --bins --target "${{ matrix.target }}"

      - name: Build Linux and Windows Guest Tools
        run: |
          cross build --locked --manifest-path guest-tools/Cargo.toml -p vexa-guest-tools --release --target x86_64-unknown-linux-gnu
          cross build --locked --manifest-path guest-tools/Cargo.toml -p vexa-guest-tools --release --target x86_64-pc-windows-gnu

      - name: Package installer payload
        run: |
          ./scripts/package-release.sh "${{ matrix.target }}" dist
          ./scripts/package-deb.sh "${{ matrix.target }}" dist
          install -m0755 install.sh dist/install.sh
          install -m0755 "target/${{ matrix.target }}/release/vexa-vm" \
            "dist/vexa-vm-${{ matrix.target }}"
          (cd dist && sha256sum install.sh > install.sh.sha256)
          (cd dist && sha256sum "vexa-vm-${{ matrix.target }}" > \
            "vexa-vm-${{ matrix.target }}.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: vexa-vm-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_PRIVATE_KEY_B64: ${{ secrets.VEXA_RELEASE_PRIVATE_KEY_B64 }}
      RELEASE_KEY_ID: ${{ vars.VEXA_RELEASE_KEY_ID }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create and sign update manifest
        if: env.RELEASE_PRIVATE_KEY_B64 != '' && env.RELEASE_KEY_ID != ''
        run: |
          set -Eeuo pipefail
          [[ "${RELEASE_KEY_ID}" =~ ^[A-Za-z0-9._:@/-]{1,128}$ ]] || {
            printf 'VEXA_RELEASE_KEY_ID is missing or invalid\n' >&2
            exit 1
          }

          archive="dist/vexa-vm-x86_64-unknown-linux-gnu.tar.gz"
          [[ -f "${archive}" ]] || {
            printf 'release archive is missing: %s\n' "${archive}" >&2
            exit 1
          }
          release="${GITHUB_REF_NAME#v}"
          sha256="$(sha256sum "${archive}" | awk '{print $1}')"
          size_bytes="$(stat -c '%s' "${archive}")"
          published_at="$(date -u +%s)"
          asset_url="https://github.com/ItzGlace/vexa-vm/releases/download/${GITHUB_REF_NAME}/$(basename "${archive}")"
          manifest="dist/vexa-vm-update-manifest.json"
          envelope="dist/vexa-vm-update-manifest.json.sig"

          jq -n \
            --arg repository "ItzGlace/vexa-vm" \
            --arg release "${release}" \
            --argjson published_at "${published_at}" \
            --arg url "${asset_url}" \
            --arg sha256 "${sha256}" \
            --argjson size_bytes "${size_bytes}" \
            '{
              schema_version: 1,
              repository: $repository,
              release: $release,
              published_at: $published_at,
              components: [{
                component: "vexa-vm",
                version: $release,
                delivery: {
                  type: "signed_archive",
                  url: $url,
                  sha256: $sha256,
                  size_bytes: $size_bytes,
                  target: "x86_64-unknown-linux-gnu"
                }
              }]
            }' > "${manifest}"

          private_key="$(mktemp)"
          signature="$(mktemp)"
          cleanup() {
            rm -f "${private_key}" "${signature}"
          }
          trap cleanup EXIT
          printf '%s' "${RELEASE_PRIVATE_KEY_B64}" | base64 --decode > "${private_key}"
          chmod 0600 "${private_key}"
          openssl pkeyutl -sign -rawin -inkey "${private_key}" \
            -in "${manifest}" -out "${signature}"
          [[ "$(stat -c '%s' "${signature}")" -eq 64 ]] || {
            printf 'Ed25519 signature did not contain 64 bytes\n' >&2
            exit 1
          }
          signature_b64="$(base64 -w0 "${signature}")"
          jq -n \
            --arg key_id "${RELEASE_KEY_ID}" \
            --arg signature "${signature_b64}" \
            '{algorithm: "ed25519", key_id: $key_id, signature: $signature}' \
            > "${envelope}"

      - name: Explain omitted panel-update manifest
        if: env.RELEASE_PRIVATE_KEY_B64 == '' || env.RELEASE_KEY_ID == ''
        run: |
          printf '%s\n' \
            'Release signing is not configured; publishing installable assets without the optional panel-update manifest.'

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
