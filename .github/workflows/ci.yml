name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@1.75.0
      - name: Build browser assets
        run: |
          npm ci
          npm run build
          npm test
      - name: Test application and Guest Tools
        run: |
          cargo test --locked --all-targets
          cargo test --locked --manifest-path guest-tools/Cargo.toml --workspace
      - name: Verify clean public source
        run: ./scripts/check-public-release.sh
