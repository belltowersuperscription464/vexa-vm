name: Bug report
description: Report a reproducible Vexa-VM defect without production secrets or customer data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Use private vulnerability reporting.
  - type: input
    id: version
    attributes:
      label: Vexa-VM version
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Hypervisor backend
      options: [libvirt, mock, unknown]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected behavior and sanitized reproduction steps.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed tokens, passwords, customer data, public infrastructure details, and VM secrets.
          required: true
